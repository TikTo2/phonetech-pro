
name: PhoneTech Pro APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter Project
        run: flutter create --project-name phonetech_pro --platforms android app

      - name: Add App Code
        run: |
          mkdir -p app/lib
          cp source/main.dart app/lib/main.dart

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneTech-Pro-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          
